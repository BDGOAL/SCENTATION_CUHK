const updateLayout = () => {
    const root = document.getElementById('root');
    if (!root) return;
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    const targetW = 2160;
    const targetH = 3840;
    const scale = Math.min(screenW / targetW, screenH / targetH);
    root.style.position = 'absolute';
    root.style.left = '50%';
    root.style.top = '50%';
    root.style.transformOrigin = 'center center';
    root.style.transform = `translate(-50%, -50%) scale(${scale})`;
    root.style.opacity = 1;
    const loader = document.getElementById('loading');
    if(loader) loader.style.display = 'none';
};

window.addEventListener('load', updateLayout);
window.addEventListener('resize', updateLayout);

                    </div>
                )}

                {/* Instagram Page */}
                {showInstagram && (
                    <div style={{ paddingTop: '500px', textAlign: 'center' }}>
                        <h2 style={{ fontSize: '110px', color: '#D4AF37' }}>{currentLang === 'zh-TW' ? '關注我們的 Instagram' : 'Follow Us on Instagram'}</h2>
                        <div style={{ fontSize: '55px', color: '#FFF', margin: '50px 200px', lineHeight: '1.4' }}>
                            {currentLang === 'zh-TW' ? '掃描QR Code關注我們，以獲取更多心理健康小貼士及資源' : 'Scan to follow us for more wellness tips and mental health resources'}
                        </div>
                        <div style={{ width: '900px', height: '900px', background: '#FFF', margin: '80px auto', borderRadius: '40px', padding: '50px', boxShadow: '0 0 50px #D4AF37' }}>
                            <img src={instagramQR} style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
                        </div>
                        <div style={{ fontSize: '60px', color: '#B8860B', marginBottom: '150px' }}>@sunshineatcuhk_osa_wacc</div>
                        <button onClick={restartQuiz} style={{ width: '800px', height: '180px', borderRadius: '30px', border: 'none', background: '#B8860B', color: '#FFF', fontSize: '70px', fontWeight: 700 }}>{t.result.restart}</button>
                    </div>
                )}

                {/* Language Switcher */}
                <div style={{ position: 'absolute', bottom: '80px', right: '80px', display: 'flex', gap: '30px' }}>
                    <button onClick={() => setCurrentLang('zh-TW')} style={{ width: '220px', height: '100px', borderRadius: '20px', background: currentLang === 'zh-TW' ? '#B8860B' : '#333', color: '#FFF', fontSize: '40px', border: 'none' }}>繁體</button>
                    <button onClick={() => setCurrentLang('en')} style={{ width: '220px', height: '100px', borderRadius: '20px', background: currentLang === 'en' ? '#B8860B' : '#333', color: '#FFF', fontSize: '40px', border: 'none' }}>English</button>
                </div>
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Walk with You - CUHK Wellness Centre</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; }
body, html {
    margin: 0; padding: 0;
    background-color: #1A1A1A;
    width: 100%; height: 100%;
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
}
#root { 
    width: 2160px; height: 3840px; 
    background-color: #1A1A1A;
    opacity: 0; transition: opacity 0.5s ease-in;
}
button { cursor: pointer; transition: opacity 0.1s; }
button:active { opacity: 0.8; }
#loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1A1A1A; color: #B8860B;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    font-size: 40px; font-family: 'Inter', sans-serif;
    z-index: 9999;
}
</style>
</head>
<body>
<div id="loading"><div>Loading System...</div></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

const updateLayout = () => {
    const root = document.getElementById('root');
    if (!root) return;
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    const targetW = 2160;
    const targetH = 3840;
    const scale = Math.min(screenW / targetW, screenH / targetH);
    root.style.position = 'absolute';
    root.style.left = '50%';
    root.style.top = '50%';
    root.style.transformOrigin = 'center center';
    root.style.transform = `translate(-50%, -50%) scale(${scale})`;
    root.style.opacity = 1;
    const loader = document.getElementById('loading');
    if(loader) loader.style.display = 'none';
};

window.addEventListener('load', updateLayout);
window.addEventListener('resize', updateLayout);

const cuhkLogo = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/WACC_logo-01.png';
const walkWithYouLogo = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/Walk%20with%20You_Logo.png';
const instagramQR = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/sunshineatcuhk_osa_wacc_qr.png';
const introImg = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/Front-01.png';

const App = () => {
    const [currentPage, setCurrentPage] = useState('intro');
    const [currentLang, setCurrentLang] = useState('zh-TW');
    const [playerName, setPlayerName] = useState('');
    const [showInstagram, setShowInstagram] = useState(false);
    
    const isZH = currentLang === 'zh-TW';

    const restartQuiz = () => {
        setPlayerName('');
        setShowInstagram(false);
        setCurrentPage('intro');
    };

    // Footer Navigation Component
    const FooterNav = () => (
        <div style={{ position: 'absolute', bottom: '60px', width: '100%', padding: '0 100px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', zIndex: 200 }}>
            {/* Left side Home button */}
            <button onClick={restartQuiz} style={{ width: '200px', height: '90px', borderRadius: '15px', background: '#333', color: '#FFF', fontSize: '38px', border: 'none', fontWeight: 500 }}>
                {isZH ? '首頁' : 'Home'}
            </button>
            {/* Right side Lang switchers */}
            <div style={{ display: 'flex', gap: '30px' }}>
                <button onClick={() => setCurrentLang('zh-TW')} style={{ width: '200px', height: '90px', borderRadius: '15px', background: isZH ? '#B8860B' : '#333', color: '#FFF', fontSize: '38px', border: 'none' }}>繁體</button>
                <button onClick={() => setCurrentLang('en')} style={{ width: '200px', height: '90px', borderRadius: '15px', background: !isZH ? '#B8860B' : '#333', color: '#FFF', fontSize: '38px', border: 'none' }}>English</button>
            </div>
        </div>
    );

    return (
        <div style={{ position: 'relative', width: '2160px', height: '3840px', overflow: 'hidden' }}>
            <img src="https://raw.githubusercontent.com/BDGOAL/SCENTATION/main/pattern.png" style={{ position: 'absolute', width: '100%', height: '100%', objectFit: 'cover' }} />
            
            <div style={{
                position: 'absolute', width: '1900px', height: '3500px', left: '130px', top: '170px',
                background: 'linear-gradient(165.55deg, #1A1A1A 0%, #2B2B2B 100%)',
                boxShadow: '0px 0px 60px 15px rgba(212, 175, 55, 0.4)', borderRadius: '45px', overflow: 'hidden'
            }}>
                {/* Global Top Banner */}
                <div style={{ width: '100%', height: '320px', background: '#FFF', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <img src={cuhkLogo} style={{ height: '240px' }} />
                </div>

                {/* Intro Page */}
                {currentPage === 'intro' && (
                    <div style={{ paddingTop: '150px', textAlign: 'center' }}>
                        {/* Subtitle: 縮小 2px (ZH: 65px -> EN: 63px) */}
                        <div style={{ 
                            fontSize: isZH ? '65px' : '63px', 
                            color: '#B8860B', 
                            lineHeight: '1.5', 
                            marginTop: '100px' 
                        }}>
                            {isZH ? "香氣不是魔法" : "Fragrance may not be magic,"}<br/>
                            {isZH ? "但它會提醒你：「你值得被溫柔對待」" : "but it reminds you to be gentle with yourself"}
                        </div>

                        {/* Title: 縮小 5px (ZH: 135px -> EN: 130px) */}
                        <div style={{ 
                            fontSize: isZH ? '135px' : '130px', 
                            fontWeight: 700, 
                            color: '#B8860B', 
                            margin: '140px 0', 
                            lineHeight: '1.2' 
                        }}>
                            {isZH ? "探索你的專屬香氣" : "Explore your unique scent,"}<br/>
                            {isZH ? "連結情緒與香氛" : "connecting emotions with scent."}
                        </div>

                        <img src={introImg} style={{ width: '1150px', borderRadius: '35px' }} />

                        <div style={{ marginTop: '200px' }}>
                            {/* Button text: 縮小 2px (ZH: 80px -> EN: 76px) */}
                            <button onClick={() => setCurrentPage('nameInput')} style={{ 
                                width: '1100px', 
                                height: '220px', 
                                background: '#B8860B', 
                                color: '#FFF', 
                                fontSize: isZH ? '80px' : '76px', 
                                borderRadius: '35px', 
                                border: 'none', 
                                fontWeight: 700 
                            }}>
                                {isZH ? "按此啟動 探索香氣" : "Discover Your Unique Scent"}
                            </button>
                            
                            {/* Bottom Tip: 縮小 2px (ZH: 50px -> EN: 48px) */}
                            <div style={{ 
                                marginTop: '40px', 
                                fontSize: isZH ? '50px' : '48px', 
                                color: '#B8860B' 
                            }}>
                                {isZH ? "*點擊上方按鈕開始您的香味測試" : "*Tap the button above to start your scent quiz"}
                            </div>
                        </div>
                    </div>
                )}

                {/* 其他頁面內容保持與之前一致，確保位置鎖定 */}
                {currentPage === 'nameInput' && (
                    <div style={{ paddingTop: '550px', textAlign: 'center' }}>
                        <h2 style={{ fontSize: '120px', color: '#B8860B' }}>{isZH ? '請輸入您的姓名' : 'Enter Your Name'}</h2>
                        <div style={{ width: '1100px', height: '200px', background: '#FFF', margin: '150px auto', borderRadius: '35px', fontSize: '90px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#333' }}>
                            {playerName || (isZH ? '輸入姓名' : 'Your name')}
                        </div>
                        {/* 虛擬鍵盤與按鈕邏輯在此... */}
                    </div>
                )}

                {/* Footer 固定位置 */}
                <FooterNav />
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Walk with You - CUHK Wellness Centre</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body, html { 
    margin: 0; padding: 0; 
    background-color: #1A1A1A; 
    width: 100%; height: 100%; 
    overflow: hidden; 
    /* 防禦修正 2：禁止捲動行為 */
    touch-action: none; 
    user-select: none;
    -webkit-user-select: none;
}

#root { 
    width: 2160px; height: 3840px; 
    background-color: #1A1A1A; 
    opacity: 0; transition: opacity 0.5s ease-in; 
    position: absolute; left: 50%; top: 50%; 
    transform-origin: center center; 
}

button { cursor: pointer; transition: opacity 0.1s; border: none; outline: none; }
button:active { opacity: 0.8; }
#loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1A1A1A; color: #B8860B; display: flex; justify-content: center; align-items: center; font-size: 40px; font-family: 'Inter', sans-serif; z-index: 9999; }
</style>
</head>
<body>
<div id="loading"><div>Loading System...</div></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const updateLayout = () => {
    const root = document.getElementById('root');
    if (!root) return;
    const scale = Math.min(window.innerWidth / 2160, window.innerHeight / 3840);
    root.style.transform = `translate(-50%, -50%) scale(${scale})`;
    root.style.opacity = 1;
    document.getElementById('loading').style.display = 'none';
};

window.addEventListener('load', updateLayout);
window.addEventListener('resize', updateLayout);

// 防禦修正 3：禁用右鍵選單
document.oncontextmenu = (e) => e.preventDefault();

const cuhkLogo = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/WACC_logo-01.png';
const walkWithYouLogo = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/Walk%20with%20You_Logo.png';
const instagramQR = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/sunshineatcuhk_osa_wacc_qr.png';
const iconA = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION/refs/heads/main/iconA.png';
const iconB = 'https://raw.githubusercontent.com/BDGOAL/SCENTATION/refs/heads/main/IconB.png';

const pageAssets = {
    introCN: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/P2%20CN.png',
    introEN: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/P2%20ENG.png',
    q1: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/P3.png',
    q2: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/P4%20HR.png',
    q3: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/P5.png',
    q4: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/P6.png'
};

const wellnessResults = {
    '4A': { 
        bodySaysCN: '「我像一根被拉緊的琴弦，\n需要好好放鬆一下」', bodySaysEN: '"I feel like a tightened string;\nI need to relax."', 
        scentCN: '深呼吸木質調\n(雪松＋薰衣草)', scentEN: 'Deep-breathing woody notes\n(Cedar + Lavender)', 
        reminderCN: '你最近真的很努力了。現在讓自己找個舒適角落，\n深深地呼吸，像大樹一樣好好地休息一下。', 
        reminderEN: "You've working so hard lately. \nNow find a comfortable corner, take a deep breath, \nand rest like a great tree—steady and calm.", 
        products: [
            { nameCN: 'Morning Garden', nameEN: 'Morning Garden', descCN: '清新蕃茄葉與迷迭香氣息，\n喚醒靈魂的7點花園綠意。', descEN: 'Fresh tomato leaves and rosemary,\nawakening the soul with 7 AM garden greenery.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/morning%20garden.webp' },
            { nameCN: 'Men’s Garage', nameEN: 'Men’s Garage', descCN: '皮革與木質氣息交織，\n在靜謐車庫裡關掉世界，\n只為男人保留一隅天地。', descEN: 'Leather and woody notes intertwine,\nshutting out the world for a private sanctuary.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/TMG2.png' }
        ] 
    },
    '3A': { 
        bodySaysCN: '「我有點疲憊，需要一個溫暖的擁抱。」', bodySaysEN: '"I\'m a bit tired, I need a warm hug."', 
        scentCN: '療癒花香調\n(洋甘菊＋依蘭)', scentEN: 'Healing Floral Notes\n(Chamomile + Ylang-Ylang)', 
        reminderCN: '看到你這樣打拼，心裡真的好為你感動。\n讓這香氣成為擁抱，告訴你：「已經做很好了，值得被好好疼愛」。', 
        reminderEN: 'Seeing how hard you\'ve been striving truly moves me. \nLet this fragrance be a gentle embrace, reminding you: \n"You\'ve already put in lots of efforts. \nYou deserve tender love."', 
        products: [
            { nameCN: 'The First Rose', nameEN: 'The First Rose', descCN: '水蜜桃與嫩玫瑰悄然綻放，\n封存青春裡那朵心動羞怯的初戀玫瑰。', descEN: 'Peach and tender rose bloom quietly,\ncapturing heart-fluttering memories of first love.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/TFR3.png' },
            { nameCN: '白蘭花', nameEN: 'White Michelia', descCN: '經典的香港味道，\n提醒我們去欣賞身邊細碎的美好。', descEN: 'A popular Hong Kong style fragrance\nthat reminds you to appreciate things around you.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/White%20Michelia.webp' }
        ] 
    },
    '2A': { 
        bodySaysCN: '「我需要一點支持，但目前情況還可以。」', bodySaysEN: '"I need a little support, but I\'m okay."', 
        scentCN: '平衡香草調\n(香草＋廣藿香)', scentEN: 'Balancing Vanilla Notes\n(Vanilla + Patchouli)', 
        reminderCN: '你已經在很努力地平衡一切了！\n這香氣像一杯熱飲，溫暖剛剛好，\n悄悄對你「可以慢慢來，不用急著做到最好」。', 
        reminderEN: 'You\'ve been working hard to balance everything! \nThis fragrance is like a warm drink—comforting and whispering: \n"Take it slow, there\'s no need to chase perfection."', 
        products: [
            { nameCN: 'Me Time', nameEN: 'Me Time', descCN: '寧靜的氣息，讓你放慢腳步，\n重新找回自我的價值。', descEN: 'A calm fragrance that makes you\nlay back and find your own worth.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/Me%20time.webp' },
            { nameCN: 'The Old Library', nameEN: 'The Old Library', descCN: '紙張與老木書架的氣味交疊，\n像昏黃午後的老圖書館裡，\n靜靜發酵的青春記憶。', descEN: 'Layers of paper and old wooden bookshelves,\nlike youth memories fermenting in a golden afternoon.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/TOL4.png' }
        ] 
    },
    '1A': { 
        bodySaysCN: '「我大致上沒問題，但還可以做得更好。」', bodySaysEN: '"I\'m basically okay, but could be better."', 
        scentCN: '清新海洋調\n(海鹽＋薄荷)', scentEN: 'Refreshing Ocean Notes\n(Sea Salt + Mint)', 
        reminderCN: '你處理得很好！\n這清新的香氣像微風輕輕吹過，\n喚醒你最舒服自在的那一面。', 
        reminderEN: 'You\'re handling things wonderfully! \nThis fresh scent is like a gentle breeze, \nawakening your most relaxed and comfortable self.', 
        products: [
            { nameCN: 'Golden Hour', nameEN: 'Golden Hour', descCN: '5:45金色海灘上，\n海鹽與椰子隨海風吹拂，\n彷彿暫離現實的輕盈度假時刻。', descEN: 'Sea salt and coconut breeze on a golden beach,\na weightless holiday moment away from reality.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/golden%20hour.webp' },
            { nameCN: 'Ocean & Cedarwood', nameEN: 'Ocean & Cedarwood', descCN: '鹹味海風輕拂，溫潤雪松與沉香相擁，\n譜出寧靜沉穩的木質海洋氣息。', descEN: 'Salty sea breeze meets warm cedar and oud,\ncomposing a calm and steady woody-marine melody.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/ocean%20and%20cedarwood.webp' }
        ] 
    },
    '0A': { 
        bodySaysCN: '「我狀態不錯！還可以更有活力」', bodySaysEN: '"I\'m in good shape! I could be even more energized."', 
        scentCN: '活力柑橘調\n(血橙＋粉紅葡萄柚)', scentEN: 'Energizing Citrus Notes\n(Blood Orange + Pink Grapefruit)', 
        reminderCN: '你真的找到很好的節奏呢！\n這香氣像早晨的第一道陽光，\n帶著輕盈開心的感覺，繼續往前走。', 
        reminderEN: 'You\'ve truly found a great rhythm. \nThis fragrance is like the first ray of morning sunshine, \ncarrying a light and joyful feeling to keep you moving forward.', 
        products: [
            { nameCN: 'Evening Unwind', nameEN: 'Evening Unwind', descCN: '清甜的無花果香，\n讓你在一天結束之際學會感恩。', descEN: 'A light sweet fig fragrance\nthat makes you appreciate your day.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/Evening%20Unwind.webp' },
            { nameCN: 'Pomelo Petals', nameEN: 'Pomelo Petals', descCN: '清爽柚子疊合橙花與迷迭香，\n綻放苦甜交織、輕盈獨特的柑橘花香。', descEN: 'Refreshing pomelo with neroli and rosemary;\na light, unique citrus floral with bittersweet layers.', image: 'https://raw.githubusercontent.com/BDGOAL/SCENTATION_CUHK/refs/heads/main/pomelo.webp' }
        ] 
    }
};

const App = () => {
    const [currentPage, setCurrentPage] = useState('intro');
    const [currentLang, setCurrentLang] = useState('zh-TW');
    const [playerName, setPlayerName] = useState('');
    const [answers, setAnswers] = useState([]);
    const [showInstagram, setShowInstagram] = useState(false);
    const timerRef = useRef(null);

    const isZH = currentLang === 'zh-TW';

    // 防禦修正 4：自動重置計時器
    const resetIdleTimer = () => {
        if (timerRef.current) clearTimeout(timerRef.current);
        if (currentPage === 'intro') return;
        timerRef.current = setTimeout(() => {
            restart();
        }, 60000); 
    };

    useEffect(() => {
        window.addEventListener('touchstart', resetIdleTimer);
        window.addEventListener('mousedown', resetIdleTimer);
        resetIdleTimer();
        return () => {
            window.removeEventListener('touchstart', resetIdleTimer);
            window.removeEventListener('mousedown', resetIdleTimer);
            if (timerRef.current) clearTimeout(timerRef.current);
        };
    }, [currentPage, showInstagram]);

    const t = isZH ? {
        name: { title: "請輸入您的姓名", subtitle: "讓我們為您量身打造香氣體驗", placeholder: "輸入姓名", start: "開始測試" },
        qs: [
            { title: '最近的壓力就像：', options: ['腦子裡像開了99個瀏覽分頁，\n不斷想著要溫習。', '有時候能放鬆，還撐得住！'] },
            { title: '昨晚的睡眠狀態：', options: ['失眠，早上起來像喪屍一樣。', '睡得著，早上精神也不錯。'] },
            { title: '此刻的心情：', options: ['有點低落，吃東西都沒味道。', '還是笑得出來。'] },
            { title: '身體的能量水平：', options: ['肩膀和脖子痠痛，爬樓梯會喘氣。', '活力充沛，從CC走上本部都沒問題。'] }
        ],
        res: { bodyTitle: "你的身體在說", scentTitle: "心理健康及輔導中心為你推薦的香調", reminderTitle: "給你的小叮嚀", restart: "重新開始", next: "下一步" }
    } : {
        name: { title: "Enter Your Name", subtitle: "Let us tailor a scent experience just for you", placeholder: "Your name", start: "START" },
        qs: [
            { title: 'Recent stress feels like:', options: ['Brain running 99 tabs,\ncan\'t stop thinking about studying', 'Still chill enough, holding up fine!'] },
            { title: 'Sleep quality last night:', options: ['Insomnia, zombie mode in morning', 'Can sleep, morning energy good'] },
            { title: 'Current mood status:', options: ['Feeling gray, food tastes blah', 'Still smiling at times'] },
            { title: 'Physical energy level:', options: ['Neck hurts, stairs make me gasp', 'Full energy, can hike up campus hill'] }
        ],
        res: { bodyTitle: "What Your Body Says", scentTitle: "Recommended Scents from WACC", reminderTitle: "A Gentle Reminder for You", restart: "Restart", next: "Next" }
    };

    const handleAnswer = (choice) => {
        const newAns = [...answers, choice];
        setAnswers(newAns);
        if (typeof currentPage === 'number') {
            if (currentPage < 4) setCurrentPage(currentPage + 1);
            else setCurrentPage('result');
        }
    };

    const restart = () => { setAnswers([]); setPlayerName(''); setShowInstagram(false); setCurrentPage('intro'); };

    return (
        <div style={{ position: 'relative', width: '2160px', height: '3840px', overflow: 'hidden' }}>
            <img src="https://raw.githubusercontent.com/BDGOAL/SCENTATION/main/pattern.png" style={{ position: 'absolute', width: '100%', height: '100%', objectFit: 'cover' }} />
            
            <div style={{ position: 'absolute', width: '1900px', height: '3500px', left: '130px', top: '170px', background: 'linear-gradient(165.55deg, #1A1A1A 0%, #2B2B2B 100%)', boxShadow: '0px 0px 60px 15px rgba(212, 175, 55, 0.4)', borderRadius: '45px', overflow: 'hidden' }}>
                
                <div style={{ width: '100%', height: '320px', background: '#FFF', display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: '1px solid #ddd' }}>
                    <img src={cuhkLogo} style={{ height: '240px' }} />
                </div>

                {currentPage === 'intro' && (
                    <div style={{ textAlign: 'center', height: 'calc(100% - 320px)', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center' }}>
                        <div onClick={() => setCurrentPage('nameInput')} style={{ cursor: 'pointer', width: '100%', height: '100%' }}>
                            <img src={isZH ? pageAssets.introCN : pageAssets.introEN} style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
                        </div>
                    </div>
                )}

                {currentPage === 'nameInput' && (
                    <div style={{ textAlign: 'center', paddingTop: '150px' }}>
                        <h2 style={{ fontSize: '135px', fontWeight: 700, color: '#B8860B', marginTop: '100px', marginBottom: '40px' }}>{t.name.title}</h2>
                        <div style={{ fontSize: '55px', fontWeight: 500, color: '#FFF', marginBottom: '120px' }}>{t.name.subtitle}</div>
                        <div style={{ width: '1020px', height: '155px', background: '#FFF', margin: '0 auto 120px', borderRadius: '30px', fontSize: '75px', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#333' }}>{playerName || t.name.placeholder}</div>
                        <div style={{ width: '1600px', margin: '0 auto', display: 'flex', flexWrap: 'wrap', gap: '22px', justifyContent: 'center' }}>
                            {'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => (
                                <button key={l} onClick={() => setPlayerName(p => (p+l).slice(0,10))} style={{ width: '135px', height: '135px', fontSize: '60px', borderRadius: '25px', background: '#333', color: '#FFF', border: '3px solid #B8860B', fontWeight: 500 }}>{l}</button>
                            ))}
                            <button onClick={() => setPlayerName(p => p.slice(0, -1))} style={{ width: '380px', height: '135px', background: '#555', color: '#FFF', fontSize: '45px', borderRadius: '25px', fontWeight: 600 }}>DELETE</button>
                        </div>
                        <button onClick={() => setCurrentPage(1)} style={{ width: '400px', height: '125px', background: '#B8860B', color: '#FFF', fontSize: '48px', borderRadius: '25px', fontWeight: 700, marginTop: '80px' }}>{t.name.start}</button>
                    </div>
                )}

                {typeof currentPage === 'number' && (
                    <div style={{ textAlign: 'center', paddingTop: '150px' }}>
                        <div style={{ fontSize: '60px', color: '#FFF', marginBottom: '60px' }}>{isZH ? '請選擇一個最接近你目前狀況的句子：' : 'Choose the sentence that best fits you:'}</div>
                        <div style={{ width: '1500px', height: '30px', background: '#333', borderRadius: '15px', margin: '0 auto 80px', overflow: 'hidden' }}>
                            <div style={{ width: `${currentPage * 25}%`, height: '100%', background: '#B8860B' }}></div>
                        </div>
                        <h2 style={{ fontSize: '90px', color: '#B8860B', marginBottom: '80px' }}>{t.qs[currentPage-1].title}</h2>
                        <img src={pageAssets[`q${currentPage}`]} style={{ width: '1300px', height: '900px', objectFit: 'contain', marginBottom: '100px' }} />
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '50px', alignItems: 'center' }}>
                            {t.qs[currentPage-1].options.map((opt, i) => (
                                <button key={i} onClick={() => handleAnswer(i===0?'A':'B')} style={{ width: '1500px', minHeight: '220px', border: '5px solid #FFF', borderRadius: '35px', background: 'transparent', color: '#FFF', fontSize: '65px', padding: '40px', display: 'flex', alignItems: 'center', whiteSpace: 'pre-line' }}>
                                    <img src={i===0?iconA : iconB} style={{ width: '120px', marginRight: '40px' }} />
                                    <span style={{ textAlign: 'left' }}>{opt}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                )}

                {currentPage === 'result' && !showInstagram && (() => {
                    const aCount = answers.filter(a => a === 'A').length;
                    const res = wellnessResults[`${aCount}A`];
                    return (
                        <div style={{ textAlign: 'center', paddingTop: '120px' }}>
                            <div style={{ width: '450px', height: '450px', borderRadius: '50%', background: '#FFF', border: '12px solid #D4AF37', margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                <img src={walkWithYouLogo} style={{ width: '80%' }} />
                            </div>
                            <h2 style={{ fontSize: '110px', color: '#D4AF37', margin: '40px 0' }}>{t.res.bodyTitle}</h2>
                            <div style={{ fontSize: '60px', color: '#FFF', fontStyle: 'italic', padding: '0 200px', marginBottom: '60px', whiteSpace: 'pre-line' }}>
                                {isZH ? res.bodySaysCN : res.bodySaysEN}
                            </div>
                            
                            <div style={{ width: '1650px', background: 'rgba(212,175,55,0.08)', borderRadius: '45px', border: '6px solid #D4AF37', margin: '0 auto', overflow: 'hidden' }}>
                                <div style={{ background: '#D4AF37', color: '#FFF', fontSize: '60px', padding: '40px', fontWeight: 700 }}>{t.res.scentTitle}</div>
                                <div style={{ fontSize: '80px', color: '#FFF', margin: '40px 0', fontWeight: 700, whiteSpace: 'pre-line', lineHeight: '1.2' }}>
                                    {isZH ? res.scentCN : res.scentEN}
                                </div>
                                <div style={{ display: 'flex', justifyContent: 'center', gap: '80px', padding: '0 60px 50px' }}>
                                    {res.products.map((p, i) => (
                                        <div key={i} style={{ width: '680px', background: '#D4AF37', borderRadius: '35px', padding: '25px', display: 'flex', flexDirection: 'column' }}>
                                            <img src={p.image} style={{ width: '100%', height: '530px', objectFit: 'cover', borderRadius: '25px', background: '#FFF' }} />
                                            <div style={{ fontSize: '50px', color: '#FFF', fontWeight: 700, margin: '20px 0' }}>{isZH ? p.nameCN : p.nameEN}</div>
                                            <div style={{ fontSize: isZH ? '36px' : '40px', color: '#FFF', lineHeight: '1.4', flexGrow: 1, whiteSpace: 'pre-line' }}>{isZH ? p.descCN : p.descEN}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div style={{ marginTop: '70px', padding: '0 150px' }}>
                                <div style={{ fontSize: '75px', color: '#D4AF37', fontWeight: 700 }}>{t.res.reminderTitle}</div>
                                <div style={{ fontSize: '48px', color: '#FFF', marginTop: '30px', lineHeight: '1.5', whiteSpace: 'pre-line' }}>
                                    {isZH ? res.reminderCN : res.reminderEN}
                                </div>
                            </div>

                            <div style={{ marginTop: '80px', display: 'flex', justifyContent: 'center', gap: '60px' }}>
                                <button onClick={restart} style={{ width: '500px', height: '160px', borderRadius: '35px', background: '#777', color: '#FFF', fontSize: '65px' }}>{t.res.restart}</button>
                                <button onClick={() => setShowInstagram(true)} style={{ width: '500px', height: '160px', borderRadius: '35px', background: '#B8860B', color: '#FFF', fontSize: '65px' }}>{t.res.next}</button>
                            </div>
                        </div>
                    );
                })()}

                {showInstagram && (
                    <div style={{ textAlign: 'center', paddingTop: '500px' }}>
                        <h2 style={{ fontSize: '110px', color: '#D4AF37' }}>{isZH ? '關注我們的 Instagram' : 'Follow Us on Instagram'}</h2>
                        <div style={{ width: '900px', height: '900px', background: '#FFF', margin: '80px auto', borderRadius: '45px', padding: '50px', boxShadow: '0px 0px 50px rgba(212, 175, 55, 0.5)' }}>
                            <img src={instagramQR} style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
                        </div>
                        <div style={{ fontSize: '60px', color: '#B8860B', marginBottom: '150px' }}>@sunshineatcuhk_osa_wacc</div>
                        <button onClick={restart} style={{ width: '800px', height: '220px', background: '#B8860B', color: '#FFF', fontSize: '80px', borderRadius: '40px' }}>{isZH ? '重新開始' : 'Restart'}</button>
                    </div>
                )}

                <div style={{ position: 'absolute', bottom: '50px', width: '100%', padding: '0 100px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', zIndex: 1000 }}>
                    <button onClick={restart} style={{ width: '220px', height: '90px', borderRadius: '20px', background: '#333', color: '#FFF', fontSize: '40px' }}>{isZH ? '首頁' : 'Home'}</button>
                    <div style={{ display: 'flex', gap: '20px' }}>
                        <button onClick={() => setCurrentLang('zh-TW')} style={{ width: '180px', height: '80px', borderRadius: '15px', background: isZH ? '#B8860B' : '#333', color: '#FFF', fontSize: '32px' }}>繁體</button>
                        <button onClick={() => setCurrentLang('en')} style={{ width: '180px', height: '80px', borderRadius: '15px', background: !isZH ? '#B8860B' : '#333', color: '#FFF', fontSize: '32px' }}>English</button>
                    </div>
                </div>
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

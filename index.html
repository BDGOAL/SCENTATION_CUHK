const updateLayout = () => {
    const root = document.getElementById('root');
    const body = document.body;
    if (!root) return;

    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    const targetW = 2160;
    const targetH = 3840;
    const isMobile = screenW < 1000;

    if (isMobile) {
        body.style.overflow = 'hidden';
        const scale = screenW / targetW;
        root.style.position = 'absolute';
        root.style.left = '0';
        root.style.top = '0';
        root.style.transformOrigin = 'top left';
        root.style.transform = `scale(${scale})`;
    } else {
        body.style.overflow = 'hidden';
        body.style.height = '100%';
        const scale = Math.min(screenW / targetW, screenH / targetH);
        root.style.position = 'absolute';
        root.style.left = '50%';
        root.style.top = '50%';
        root.style.transformOrigin = 'center center';
        root.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    root.style.opacity = 1;
    const loader = document.getElementById('loading');
    if(loader) loader.style.display = 'none';
};

window.addEventListener('load', updateLayout);

                            left: '287px', top: currentLang === 'en' ? '2469px' : '2339px',
                            background: '#FFFFFF', borderRadius: '0px 0px 25px 25px'
                        }}></div>

                        <div style={{
                            position: 'absolute', width: '1000px', left: 'calc(50% - 1000px/2)',
                            top: currentLang === 'en' ? '2492px' : '2362px',
                            fontFamily: "'Inter', sans-serif", fontWeight: 700,
                            fontSize: currentLang === 'en' ? '42px' : '55px',
                            textAlign: 'center', color: '#B8860B'
                        }}>
                            {currentLang === 'zh-TW' ? '*點擊上方按鈕開始您的香味測試' : '*Tap the button above to start your scent quiz'}
                        </div>
                    </>
                )}

                {/* Name Input Page */}
                {currentPage === 'nameInput' && (
                    <div style={{ position: 'absolute', width: '100%', height: '100%', zIndex: 60 }}>
                        <div style={{
                            position: 'absolute', width: '1482px', left: 'calc(50% - 1482px/2)', top: '650px',
                            fontFamily: "'Inter', sans-serif", fontWeight: 700,
                            fontSize: currentLang === 'en' ? '110px' : '130px',
                            textAlign: 'center', color: '#B8860B'
                        }}>{t.nameInput.title}</div>

                        <div style={{
                            position: 'absolute', width: '1280px', left: 'calc(50% - 1280px/2)', top: '880px',
                            fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '48px' : '56px',
                            textAlign: 'center', color: '#FFFFFF'
                        }}>{t.nameInput.subtitle}</div>

                        <div style={{
                            position: 'absolute', width: '900px', height: '140px',
                            left: 'calc(50% - 900px/2)', top: '1100px',
                            background: '#FFFFFF', borderRadius: '25px',
                            display: 'flex', alignItems: 'center', padding: '0 40px', boxSizing: 'border-box'
                        }}>
                            <div style={{
                                fontFamily: "'Inter', sans-serif", fontSize: '56px',
                                color: playerName ? '#1A1A1A' : '#999999'
                            }}>{playerName || t.nameInput.placeholder}</div>
                            <span style={{ marginLeft: '10px', color: '#1A1A1A' }}>|</span>
                        </div>

                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 1400px/2)', top: '1350px',
                            display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '30px'
                        }}>
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: '20px', justifyContent: 'center' }}>
                                {keyboardLetters.map((l) => (
                                    <button key={l} onClick={() => setPlayerName(p => (p + l).slice(0, 10))} style={{
                                        width: '150px', height: '150px', borderRadius: '30px',
                                        border: '3px solid #B8860B', background: '#2B2B2B',
                                        fontFamily: "'Inter', sans-serif", fontWeight: 600,
                                        fontSize: '72px', color: '#FFFFFF'
                                    }}>{l}</button>
                                ))}
                            </div>

                            <div style={{ display: 'flex', gap: '40px', marginTop: '10px' }}>
                                <button onClick={() => setPlayerName(p => (p + ' ').slice(0, 10))} style={{
                                    width: '390px', height: '150px', borderRadius: '30px',
                                    border: '3px solid #B8860B', background: '#2B2B2B',
                                    fontFamily: "'Inter', sans-serif", fontWeight: 500,
                                    fontSize: currentLang === 'en' ? '60px' : '66px', color: '#FFFFFF'
                                }}>{currentLang === 'zh-TW' ? '空白' : 'Space'}</button>
                                <button onClick={() => setPlayerName(p => p.slice(0, -1))} style={{
                                    width: '390px', height: '150px', borderRadius: '30px',
                                    border: '3px solid #B8860B', background: '#2B2B2B',
                                    fontFamily: "'Inter', sans-serif", fontWeight: 500,
                                    fontSize: currentLang === 'en' ? '60px' : '66px', color: '#FFFFFF'
                                }}>{currentLang === 'zh-TW' ? '刪除' : 'Delete'}</button>
                                <button onClick={() => setCurrentPage(1)} style={{
                                    width: '390px', height: '150px', borderRadius: '30px', border: 'none',
                                    background: '#B8860B', fontFamily: "'Inter', sans-serif", fontWeight: 700,
                                    fontSize: currentLang === 'en' ? '60px' : '66px', color: '#FFFFFF',
                                    boxShadow: '0 0 18px 6px rgba(255,255,255,0.3)'
                                }}>{t.nameInput.button}</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* Question Pages */}
                {[1, 2, 3, 4].map(qId => {
                    const q = t.questions[qId - 1];
                    const progressWidths = [366, 692, 1081, 1400];
                    
                    return currentPage === qId && (
                        <div key={qId}>
                            <div style={{
                                position: 'absolute', width: '1280px', left: '220px', top: '676px',
                                fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '48px' : '64px',
                                textAlign: 'center', color: '#FFFFFF'
                            }}>請選擇一個最接近你目前狀況的句子：</div>

                            <div style={{
                                position: 'absolute', width: '1400px', height: '48px',
                                left: '160px', top: currentLang === 'en' ? '828px' : '804px',
                                background: '#333', borderRadius: '43px'
                            }}>
                                <div style={{
                                    width: `${progressWidths[qId - 1]}px`,
                                    height: '100%',
                                    background: '#B8860B',
                                    borderRadius: '43px',
                                    transition: 'width 0.5s'
                                }}></div>
                            </div>

                            <div style={{
                                position: 'absolute', width: '1182px',
                                left: 'calc(50% - 1182px/2)', top: currentLang === 'en' ? '1018px' : '994px',
                                fontFamily: "'Inter', sans-serif", fontWeight: 700,
                                fontSize: currentLang === 'en' ? '80px' : '96px',
                                textAlign: 'center', color: '#B8860B', whiteSpace: 'pre-line'
                            }}>{q.title}</div>

                            <div style={{
                                position: 'absolute', width: '1309px', height: '602px',
                                left: 'calc(50% - 1309px/2)', top: currentLang === 'en' ? '1348px' : '1298px',
                                borderRadius: '25px', overflow: 'hidden'
                            }}>
                                <img src={questionImages[`q${qId}`]} 
                                     style={{ width: '100%', height: '100%', objectFit: 'cover' }} 
                                     alt={`Question ${qId}`} />
                            </div>

                            <div style={{
                                position: 'absolute', width: '1449px',
                                left: 'calc(50% - 1449px/2)', top: currentLang === 'en' ? '2047px' : '1997px'
                            }}>
                                <img src={iconA} style={{
                                    position: 'absolute', left: '0px', top: '10px',
                                    width: '120px', transform: 'scale(1.2)'
                                }} alt="Option A" />
                                <button onClick={() => handleAnswer(qId, 'A')} style={{
                                    position: 'absolute', left: '160px', width: '1288px',
                                    height: currentLang === 'en' ? '260px' : '245px',
                                    border: '6px solid #FFF', borderRadius: '25px',
                                    background: 'transparent'
                                }}>
                                    <div style={{
                                        fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '50px' : '70px',
                                        padding: '0 10px', textAlign: 'center', color: '#FFFFFF', whiteSpace: 'pre-line'
                                    }}>{q.options[0]}</div>
                                </button>
                            </div>

                            <div style={{
                                position: 'absolute', width: '1449px',
                                left: 'calc(50% - 1449px/2)', top: currentLang === 'en' ? '2354px' : '2289px'
                            }}>
                                <img src={iconB} style={{
                                    position: 'absolute', left: '0px', top: '10px',
                                    width: '120px', transform: 'scale(1.2)'
                                }} alt="Option B" />
                                <button onClick={() => handleAnswer(qId, 'B')} style={{
                                    position: 'absolute', left: '160px', width: '1288px',
                                    height: currentLang === 'en' ? '260px' : '242px',
                                    border: '6px solid #FFF', borderRadius: '25px',
                                    background: 'transparent'
                                }}>
                                    <div style={{
                                        fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '50px' : '70px',
                                        padding: '0 10px', textAlign: 'center', color: '#FFFFFF', whiteSpace: 'pre-line'
                                    }}>{q.options[1]}</div>
                                </button>
                            </div>
                        </div>
                    );
                })}

                {/* Result Page */}
                {currentPage === 'result' && result && (
                    <div style={{ position: 'relative', width: '100%', height: '100%' }}>
                        {/* Title: 你的身體在說 */}
                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 700px)', top: '400px',
                            fontFamily: "'Inter', sans-serif", fontWeight: 700,
                            fontSize: currentLang === 'en' ? '90px' : '110px',
                            textAlign: 'center', color: '#B8860B'
                        }}>{t.result.title}</div>

                        {/* Body Says Text */}
                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 700px)', top: '580px',
                            fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '50px' : '60px',
                            lineHeight: '1.3', textAlign: 'center', color: '#FFFFFF', whiteSpace: 'pre-wrap'
                        }}>{currentLang === 'zh-TW' ? result.bodySaysCN : result.bodySaysEN}</div>

                        {/* Scent Section Title */}
                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 700px)', top: '820px',
                            fontFamily: "'Inter', sans-serif", fontWeight: 700,
                            fontSize: currentLang === 'en' ? '60px' : '70px',
                            textAlign: 'center', color: '#B8860B'
                        }}>{currentLang === 'zh-TW' ? t.result.scentTitle : t.result.scentSubtitle}</div>

                        {/* Scent Type */}
                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 700px)', top: '940px',
                            fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '48px' : '56px',
                            textAlign: 'center', color: '#FFFFFF'
                        }}>{currentLang === 'zh-TW' ? result.scentCN : result.scentEN}</div>

                        {/* Products */}
                        <div style={{
                            position: 'absolute', width: '1500px', left: 'calc(50% - 750px)', top: '1080px',
                            display: 'flex', flexDirection: 'column', gap: '40px'
                        }}>
                            {result.products.map((p, idx) => (
                                <div key={idx} style={{
                                    background: 'rgba(255,255,255,0.1)', borderRadius: '20px',
                                    padding: '30px 40px', border: '2px solid #B8860B'
                                }}>
                                    <div style={{
                                        fontFamily: "'Inter', sans-serif", fontWeight: 600,
                                        fontSize: '42px', color: '#B8860B', marginBottom: '15px'
                                    }}>{currentLang === 'zh-TW' ? p.nameCN : p.nameEN}</div>
                                    <div style={{
                                        fontFamily: "'Inter', sans-serif", fontSize: '36px',
                                        color: '#FFFFFF', lineHeight: '1.4'
                                    }}>{currentLang === 'zh-TW' ? p.descriptionCN : p.descriptionEN}</div>
                                </div>
                            ))}
                        </div>

                        {/* Reminder Section Title */}
                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 700px)', top: '1550px',
                            fontFamily: "'Inter', sans-serif", fontWeight: 700,
                            fontSize: currentLang === 'en' ? '60px' : '70px',
                            textAlign: 'center', color: '#B8860B'
                        }}>{t.result.reminderTitle}</div>

                        {/* Reminder Text */}
                        <div style={{
                            position: 'absolute', width: '1400px', left: 'calc(50% - 700px)', top: '1670px',
                            fontFamily: "'Inter', sans-serif", fontSize: currentLang === 'en' ? '42px' : '50px',
                            lineHeight: '1.5', textAlign: 'center', color: '#FFFFFF', whiteSpace: 'pre-wrap'
                        }}>{currentLang === 'zh-TW' ? result.reminderCN : result.reminderEN}</div>

                        {/* Restart Button */}
                        <button onClick={restartQuiz} style={{
                            position: 'absolute', width: '600px', height: '150px',
                            left: 'calc(50% - 300px)', bottom: '200px',
                            background: '#B8860B', borderRadius: '25px', border: 'none',
                            fontFamily: "'Inter', sans-serif", fontWeight: 700,
                            fontSize: currentLang === 'en' ? '60px' : '70px', color: '#FFFFFF'
                        }}>{t.result.restart}</button>
                    </div>
                )}
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

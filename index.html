const { useState, useEffect } = React;

const updateLayout = () => {
    const root = document.getElementById('root');
    if (!root) return;
    const screenW = window.innerWidth;
    const screenH = window.innerHeight;
    const targetW = 2160;
    const targetH = 3840;
    const scale = Math.min(screenW / targetW, screenH / targetH);
    root.style.position = 'absolute';
    root.style.left = '50%';
    root.style.top = '50%';
    root.style.transformOrigin = 'center center';
    root.style.transform = `translate(-50%, -50%) scale(${scale})`;
    root.style.opacity = 1;
    const loader = document.getElementById('loading');
    if(loader) loader.style.display = 'none';
};

window.addEventListener('load', updateLayout);
window.addEventListener('resize', updateLayout);

                        <div style={{ marginTop: '70px', padding: '0 150px' }}>
                            <div style={{ fontSize: '75px', color: '#D4AF37', fontWeight: 700 }}>{t.result.reminderTitle}</div>
                            <div style={{ fontSize: '50px', color: '#FFF', marginTop: '30px', lineHeight: '1.5' }}>
                                {currentLang === 'zh-TW' ? result.reminderCN : result.reminderEN}
                            </div>
                        </div>

                        {/* Bottom Buttons Container */}
                        <div style={{ position: 'absolute', bottom: '220px', width: '100%', display: 'flex', justifyContent: 'center', gap: '60px', padding: '0 100px' }}>
                            <button onClick={restartQuiz} style={{ width: '550px', height: '160px', borderRadius: '35px', border: 'none', background: '#777', color: '#FFF', fontSize: '65px', fontWeight: 700 }}>{t.result.restart}</button>
                            <button onClick={() => setShowInstagram(true)} style={{ width: '550px', height: '160px', borderRadius: '35px', border: 'none', background: '#B8860B', color: '#FFF', fontSize: '65px', fontWeight: 700, boxShadow: '0 0 30px rgba(212,175,55,0.5)' }}>{t.result.next}</button>
                        </div>
                        <LangSwitcher />
                    </div>
                )}

                {/* Instagram QR Code Page */}
                {showInstagram && (
                    <div style={{ paddingTop: '550px', textAlign: 'center' }}>
                        <h2 style={{ fontSize: '115px', color: '#D4AF37' }}>{currentLang === 'zh-TW' ? '關注我們的 Instagram' : 'Follow Us on Instagram'}</h2>
                        <div style={{ fontSize: '60px', color: '#FFF', margin: '60px 220px', lineHeight: '1.5' }}>
                            {currentLang === 'zh-TW' ? '掃描QR Code關注我們，以獲取更多心理健康小貼士及資源' : 'Scan to follow us for more wellness tips and mental health resources'}
                        </div>
                        <div style={{ width: '1000px', height: '1000px', background: '#FFF', margin: '80px auto', borderRadius: '45px', padding: '60px', boxShadow: '0 0 60px rgba(212, 175, 55, 0.5)' }}>
                            <img src={instagramQR} style={{ width: '100%', height: '100%', objectFit: 'contain' }} />
                        </div>
                        <div style={{ fontSize: '65px', color: '#B8860B', marginBottom: '150px', fontWeight: 600 }}>@sunshineatcuhk_osa_wacc</div>
                        <button onClick={restartQuiz} style={{ width: '900px', height: '200px', borderRadius: '40px', border: 'none', background: '#B8860B', color: '#FFF', fontSize: '80px', fontWeight: 700 }}>{t.result.restart}</button>
                        <LangSwitcher />
                    </div>
                )}
            </div>
        </div>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
